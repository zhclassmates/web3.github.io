function escapeHTML(s) {
  return String(s ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}
function speak(text, rate=0.78) {
  text = String(text || '').trim();
  if (!text) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE';
  u.rate = rate;
  u.pitch = 1.0;
  const voices = window.speechSynthesis.getVoices();
  const deVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('de'));
  if (deVoice) u.voice = deVoice;
  window.speechSynthesis.speak(u);
}
function normalize(s) { return String(s ?? '').toLowerCase(); }
function rowMatches(r, q, pos) {
  const blob = normalize([r.word,r.freq,r.meaning,r.ipa,r.pos,r.lemma,r.example].join(' '));
  return (!q || blob.includes(q)) && (!pos || r.pos === pos);
}
function render() {

      <td class="readBtns"><button data-speak="word">单词</button><button data-speak="example">例句</button></td>
    </tr>`;
  });
  tbody.innerHTML = html;
  document.getElementById('count').textContent = `显示 ${shown} / ${DATA.length}`;
}

  document.getElementById('readSearch').addEventListener('click', () => speak(document.getElementById('q').value || 'Hallo'));
  document.getElementById('stopRead').addEventListener('click', () => window.speechSynthesis.cancel());
  document.querySelector('#vocab tbody').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-speak]');
    if (!btn) return;
    const tr = e.target.closest('tr');
    const r = DATA[Number(tr.dataset.i)];
    const mode = btn.dataset.speak;
    speak(mode === 'example' ? r.example : r.word, mode === 'example' ? 0.82 : 0.78);
  });
  if ('speechSynthesis' in window) { window.speechSynthesis.onvoiceschanged = () => {}; }
  render();
}
setup();
</script>
</body>
</html>
